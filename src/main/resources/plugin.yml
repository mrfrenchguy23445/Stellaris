name: Stellaris
version: '1.0.0'
main: dev.stellaris.Stellaris
api-version: '1.21'
description: 'Lightweight performance suite for Paper / Purpur / Folia: dynamic view distance, redstone & physics throttling, hopper/explosion optimisation, entity AI culling, item stacking and a RAM leak watchdog.'
authors: mrfrench
website: 'https://github.com/stellaris'
folia-supported: true
softdepend:
  - packetevents
  - PlaceholderAPI

commands:
  stellaris:
    description: 'Stellaris administration root command.'
    aliases: [ st, stell ]
    usage: '/stellaris <reload|info|modules|optimize>'

permissions:
  stellaris.admin:
    description: 'Grants every Stellaris permission.'
    default: op
    children:
      stellaris.reload: true
  stellaris.reload:
    description: 'Reload the Stellaris configuration and view optimizer status.'
    default: op
