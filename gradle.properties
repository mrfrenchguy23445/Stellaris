# Stellaris build tuning.
# The build itself is deliberately tiny: every dependency is compile-time only,
# because Paper/Purpur/Folia already ship them at runtime. That keeps the
# produced jar at ~120 KB instead of ~6 MB, which is the whole point of this
# plugin: no shaded fat-jar, no duplicate classes, no startup I/O.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
